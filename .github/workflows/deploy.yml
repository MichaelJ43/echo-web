name: Deploy site

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: echo-web-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Fetch Echo release metadata
        run: npm run fetch-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECHO_APP_REPO: MichaelJ43/echo

      - name: Resolve site base path
        id: site
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
          CUSTOM_PAGES_URL: ${{ vars.CUSTOM_PAGES_URL }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x scripts/resolve-site-base.sh
          echo "path=$(./scripts/resolve-site-base.sh)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.site.outputs.path }}
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
